name: CI & Release Bundles

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-cross-platform:
    name: Test & Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install NumPy
        run: python -m pip install --upgrade pip "numpy>=1.26"

      - name: Build PEP 723 Single-File Bundle & Universal Wheel
        run: python -B -W error scripts/build_and_install.py --no-install

      - name: Run Full Geometry, 2-Manifold & Bridge Test Suite
        run: python -B -W error -m unittest discover -s tests -v

      - name: Install isolated locale-test browser
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/orca-ui-tools" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/orca-ui-tools/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Verify all offline languages, geometry and buffer lifecycle
        if: runner.os == 'Linux'
        env:
          ORCA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/orca-ui-tools/node_modules/playwright
          ORCA_LOCALE_OUTPUT: test-output/locales
        run: |
          node scripts/check_locales.cjs
          node scripts/check_modular_locales.cjs

      - name: Preserve locale verification evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gear-locale-evidence
          path: test-output/locales/
          if-no-files-found: ignore
          retention-days: 14

  attach-release-assets:
    name: Upload Bundles to GitHub Release
    needs: test-cross-platform
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install NumPy & Build Dist Artifacts
        env:
          ORCA_PLUGIN_VERSION: ${{ github.ref_name }}
        run: |
          python -m pip install --upgrade pip "numpy>=1.26"
          python -B -W error scripts/build_and_install.py --no-install

      - name: Attach .py and .whl to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/orca_gear_generator.py dist/orca_gear_generator_any.py dist/orca_gear_generator-*.whl src/gear_studio/icon.svg --clobber
