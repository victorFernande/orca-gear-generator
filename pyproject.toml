[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-gear-generator"
version = "1.4.3"
description = "Estudio parametrico 3D de engrenagens com simulacao de giro, testes de encaixe e envio direto para a mesa"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Orca Gear Studio" }
]
dependencies = [
  "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gear_studio = ["icon.svg", "locales/*.json"]

[tool.orcaslicer.plugin]
name = "Orca Gear Studio"
description = "Estudio parametrico 3D de engrenagens com simulacao de giro, testes de encaixe e envio direto para a mesa"
author = "Orca Gear Studio"
version = "1.4.3"
